<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página simple</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 15px;
      font-size: 2rem;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #5568d3;
      transform: scale(1.05);
    }

    #mensaje {
      margin-top: 20px;
      font-weight: bold;
      color: #764ba2;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>¡Hola, mundo! 👋</h1>
    <p>Esta es una página HTML simple con estilos y un poco de JavaScript.</p>
    <button onclick="saludar()">Haz clic aquí</button>
    <p id="mensaje"></p>
  </div>

  <script>
    function saludar() {
      const mensaje = document.getElementById('mensaje');
      mensaje.textContent = '¡Gracias por hacer clic! 🎉';
    }
  </script>
</body>
</html>
